

services:
  postgres:
    image: postgres:15-alpine
    container_name: mtg_postgres
    environment:
      POSTGRES_USER: mtg_user
      POSTGRES_PASSWORD: mtg_password
      POSTGRES_DB: mtg_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - mtg_network

  redis:
    image: redis:7-alpine
    container_name: mtg_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - mtg_network

volumes:
  postgres_data:
  redis_data:

networks:
  mtg_network:
    driver: bridge
